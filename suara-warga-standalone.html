<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suara Warga – Layanan Pengaduan Pemerintah</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#14213d;--mut:#5b6785;--bd:#dde3ef;--pri:#0b4f9e;--pri2:#e6f0fc;--ok:#1b7f4b;--warn:#b26a00;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#171f35;--tx:#e8edf8;--mut:#9aa7c7;--bd:#2a3556;--pri:#6aa8ff;--pri2:#1b2c4d;--ok:#4cc88a;--warn:#f0b04a;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.bar{max-width:1000px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;color:var(--pri);margin-right:auto;text-decoration:none}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:7px 12px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14px}
nav a:hover,nav a.on{background:var(--pri2);color:var(--pri)}
main{max-width:1000px;margin:auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
h1{font-size:26px;margin:0 0 6px}h2{font-size:20px;margin:0 0 12px}h3{margin:0 0 6px;font-size:16px}
p{margin:0 0 10px}.mut{color:var(--mut);font-size:14px}
.hero{background:linear-gradient(135deg,#0b4f9e,#1d7ad9);color:#fff;border-radius:16px;padding:32px 24px;margin-bottom:16px}
.hero p{opacity:.92;max-width:560px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tile{border:1px solid var(--bd);border-radius:12px;padding:14px;background:var(--card)}
.tile b{display:block;font-size:24px;color:var(--pri)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:1px}
textarea{min-height:130px;resize:vertical}
.btn{display:inline-block;background:var(--pri);color:#fff;border:0;padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.sm{padding:6px 12px;font-size:14px}.btn.del{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.hero .btn{background:#fff;color:#0b4f9e}.hero .btn.sec{background:rgba(255,255,255,.18);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;font-weight:400}.chk input{width:auto}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--pri2);color:var(--pri)}
.s-Selesai{color:var(--ok)}.s-Diproses{color:var(--warn)}.s-Ditolak{color:var(--bad)}
.item{border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--card)}
.item.click{cursor:pointer}.item.click:hover{border-color:var(--pri)}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.reply{background:var(--pri2);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.note{padding:12px 14px;border-radius:10px;background:var(--pri2);font-size:14px;margin-bottom:14px}
.err{color:var(--bad);font-size:14px;margin-top:8px}.okm{color:var(--ok);font-size:14px;margin-top:8px}
.narrow{max-width:460px;margin:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="#beranda">🏛️ Suara Warga</a><nav id="nav"></nav></div></header>
<main id="app"></main>

<script>
/* ============================================================
   LAPISAN PENYIMPANAN
   Saat ini memakai localStorage (data tersimpan di browser ini saja).
   Agar bisa diakses banyak orang, ganti isi objek Store di bawah dengan
   panggilan fetch() ke backend/API Anda (Supabase, Firebase, Node, Laravel, dll).
   Seluruh kode lain hanya memakai Store.get / Store.set.
   ============================================================ */
const Store={
  get(k,def){try{const v=localStorage.getItem('sw_'+k);return v?JSON.parse(v):def}catch(e){return def}},
  set(k,v){localStorage.setItem('sw_'+k,JSON.stringify(v))}
};

/* Akun admin awal (ganti segera setelah dipakai!) */
const ADMIN_EMAIL='admin@suarawarga.id', ADMIN_PASS='Admin#12345';

const TYPES=['Pengaduan','Laporan','Saran','Kritik'];
const STAT=['Diterima','Diproses','Selesai','Ditolak'];
const TDESC={Pengaduan:'Keluhan atas layanan atau tindakan aparat/instansi.',Laporan:'Informasi kejadian, kerusakan fasilitas, atau dugaan pelanggaran.',Saran:'Ide dan masukan untuk perbaikan layanan publik.',Kritik:'Penilaian terhadap kebijakan atau kinerja pemerintah.'};
const AGENCIES=['Pemerintah Kota/Kabupaten','Dinas Pendidikan','Dinas Kesehatan','Dinas Perhubungan','Dinas Pekerjaan Umum','Dinas Kependudukan dan Catatan Sipil','Kepolisian','Kelurahan/Desa','Lainnya'];
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const route=()=>location.hash.slice(1)||'beranda';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

async function hash(pw,salt){
  const s=salt+pw;
  if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h.toString(16);
}
const S={me:null,tab:'Semua',st:'Semua',q:'',sel:null};
const users=()=>Store.get('users',[]);
const reports=()=>Store.get('reports',[]);

async function seed(){
  const u=users();
  if(!u.some(x=>x.role==='admin')){
    const salt=uid();
    u.push({id:uid(),nama:'Administrator',email:ADMIN_EMAIL,tel:'-',kota:'-',role:'admin',salt,hash:await hash(ADMIN_PASS,salt)});
    Store.set('users',u);
  }
  const sid=Store.get('session',null);
  S.me=users().find(x=>x.id===sid)||null;
}
function logout(){Store.set('session',null);S.me=null;location.hash='beranda';render()}

function navRender(){
  const r=route(),a=(h,t)=>`<a href="#${h}" class="${r===h?'on':''}">${t}</a>`;
  let h=a('beranda','Beranda');
  if(S.me){
    if(S.me.role==='admin')h+=a('admin','Panel Admin');
    else h+=a('buat','Kirim Aspirasi')+a('riwayat','Riwayat Saya');
    h+=`<a href="#" id="lo">Keluar (${esc(S.me.nama.split(' ')[0])})</a>`;
  }else h+=a('masuk','Masuk')+a('daftar','Daftar');
  $('#nav').innerHTML=h;
  const lo=$('#lo');if(lo)lo.onclick=e=>{e.preventDefault();logout()};
}
function render(){
  navRender();
  const r=route(),el=$('#app');
  const warga=['buat','riwayat'];
  if(warga.includes(r)&&(!S.me||S.me.role==='admin')){el.innerHTML=gate();return}
  if(r==='admin'&&(!S.me||S.me.role!=='admin')){el.innerHTML=gate('Halaman ini hanya untuk administrator.');return}
  ({beranda:pBeranda,daftar:pDaftar,masuk:pMasuk,buat:pBuat,riwayat:pRiwayat,admin:pAdmin}[r]||pBeranda)(el);
}
function gate(m){return `<div class="card narrow"><h2>Perlu masuk</h2><p class="mut">${m||'Silakan masuk sebagai warga untuk mengakses halaman ini.'}</p><a class="btn" href="#masuk">Masuk</a></div>`}

function pBeranda(el){
  const rs=reports(),done=rs.filter(r=>r.status==='Selesai').length;
  el.innerHTML=`<div class="hero"><h1>Suara Anda, perubahan nyata.</h1>
  <p>Sampaikan pengaduan, laporan, saran, atau kritik kepada pemerintah. Setiap aspirasi dicatat dan ditindaklanjuti oleh petugas.</p>
  <div class="row" style="max-width:360px">${S.me?(S.me.role==='admin'?'<a class="btn" href="#admin">Buka panel admin</a>':'<a class="btn" href="#buat">Kirim aspirasi</a><a class="btn sec" href="#riwayat">Riwayat saya</a>'):'<a class="btn" href="#daftar">Daftar sekarang</a><a class="btn sec" href="#masuk">Masuk</a>'}</div></div>
  <div class="grid">${TYPES.map(t=>`<div class="tile"><h3>${t}</h3><p class="mut" style="margin:0">${TDESC[t]}</p></div>`).join('')}</div>
  <div class="card" style="margin-top:16px"><h2>Cara kerja</h2><div class="grid">
  <div><h3>1. Daftar &amp; masuk</h3><p class="mut">Buat akun warga dengan email dan kata sandi.</p></div>
  <div><h3>2. Kirim aspirasi</h3><p class="mut">Pilih jenis, instansi, dan jelaskan masalahnya.</p></div>
  <div><h3>3. Pantau tindak lanjut</h3><p class="mut">Lihat status dan balasan petugas dengan nomor tiket.</p></div></div>
  ${rs.length?`<p class="mut" style="margin:12px 0 0">${rs.length} aspirasi masuk, ${done} selesai ditangani.</p>`:''}</div>`;
}
function pDaftar(el){
  el.innerHTML=`<div class="card narrow"><h2>Pendaftaran Warga</h2>
  <label>Nama lengkap</label><input id="f-nama" maxlength="80" autocomplete="name">
  <label>Email</label><input id="f-email" type="email" maxlength="100" autocomplete="email">
  <label>Nomor telepon</label><input id="f-tel" inputmode="tel" maxlength="20" autocomplete="tel">
  <label>Kota/Kabupaten</label><input id="f-kota" maxlength="60">
  <label>Kata sandi (min. 8 karakter)</label><input id="f-pw" type="password" autocomplete="new-password">
  <label>Ulangi kata sandi</label><input id="f-pw2" type="password" autocomplete="new-password">
  <label class="chk"><input type="checkbox" id="f-ok"> Saya menyetujui data saya digunakan untuk menindaklanjuti aspirasi.</label>
  <div id="msg" class="err"></div><p></p><button class="btn" id="go">Daftar</button>
  <p class="mut" style="margin-top:12px">Sudah punya akun? <a href="#masuk">Masuk</a></p></div>`;
  $('#go').onclick=async()=>{
    const v=i=>$('#'+i).value.trim(),m=t=>$('#msg').textContent=t;
    const nama=v('f-nama'),email=v('f-email').toLowerCase(),tel=v('f-tel'),kota=v('f-kota'),pw=$('#f-pw').value;
    if(nama.length<3)return m('Nama minimal 3 karakter.');
    if(!/^\S+@\S+\.\S+$/.test(email))return m('Format email tidak valid.');
    if(!/^[0-9+\-\s]{8,20}$/.test(tel))return m('Nomor telepon tidak valid.');
    if(pw.length<8)return m('Kata sandi minimal 8 karakter.');
    if(pw!==$('#f-pw2').value)return m('Kata sandi tidak sama.');
    if(!$('#f-ok').checked)return m('Centang persetujuan terlebih dahulu.');
    const u=users();
    if(u.some(x=>x.email===email))return m('Email sudah terdaftar.');
    const salt=uid(),nu={id:uid(),nama,email,tel,kota,role:'warga',salt,hash:await hash(pw,salt)};
    u.push(nu);Store.set('users',u);Store.set('session',nu.id);S.me=nu;location.hash='beranda';render();
  };
}
function pMasuk(el){
  el.innerHTML=`<div class="card narrow"><h2>Masuk</h2>
  <label>Email</label><input id="f-email" type="email" autocomplete="username">
  <label>Kata sandi</label><input id="f-pw" type="password" autocomplete="current-password">
  <div id="msg" class="err"></div><p></p><button class="btn" id="go">Masuk</button>
  <p class="mut" style="margin-top:12px">Belum punya akun? <a href="#daftar">Daftar</a></p></div>`;
  const doLogin=async()=>{
    const email=$('#f-email').value.trim().toLowerCase(),u=users().find(x=>x.email===email);
    if(!u||u.hash!==await hash($('#f-pw').value,u.salt))return $('#msg').textContent='Email atau kata sandi salah.';
    Store.set('session',u.id);S.me=u;location.hash=u.role==='admin'?'admin':'beranda';render();
  };
  $('#go').onclick=doLogin;$('#f-pw').onkeydown=e=>{if(e.key==='Enter')doLogin()};
}
function pBuat(el){
  el.innerHTML=`<div class="card"><h2>Kirim Aspirasi</h2>
  <div class="tabs" id="tp">${TYPES.map((t,i)=>`<button data-t="${t}" class="${i?'':'on'}">${t}</button>`).join('')}</div>
  <p class="mut" id="td">${TDESC.Pengaduan}</p>
  <div class="row"><div><label>Instansi tujuan</label><select id="f-ag">${AGENCIES.map(a=>`<option>${a}</option>`).join('')}</select></div>
  <div><label>Lokasi kejadian (opsional)</label><input id="f-lok" maxlength="120"></div></div>
  <label>Judul</label><input id="f-jd" maxlength="120">
  <label>Uraian</label><textarea id="f-isi" maxlength="3000"></textarea>
  <label class="chk"><input type="checkbox" id="f-an"> Sembunyikan identitas saya dari petugas (anonim)</label>
  <div id="msg" class="err"></div><p></p><button class="btn" id="go">Kirim</button></div>`;
  let tp='Pengaduan';
  $('#tp').onclick=e=>{const t=e.target.dataset.t;if(!t)return;tp=t;[...$('#tp').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('#td').textContent=TDESC[t]};
  $('#go').onclick=()=>{
    const title=$('#f-jd').value.trim(),body=$('#f-isi').value.trim();
    if(title.length<5)return $('#msg').textContent='Judul minimal 5 karakter.';
    if(body.length<20)return $('#msg').textContent='Uraian minimal 20 karakter.';
    const an=$('#f-an').checked,id='SW-'+Date.now().toString(36).toUpperCase();
    const rs=reports();
    rs.push({id,uid:S.me.id,type:tp,agency:$('#f-ag').value,location:$('#f-lok').value.trim(),title,body,anon:an,name:an?'Anonim':S.me.nama,contact:an?'':S.me.email+' / '+S.me.tel,status:'Diterima',reply:'',createdAt:Date.now()});
    Store.set('reports',rs);
    el.innerHTML=`<div class="card narrow"><h2>✅ Terkirim</h2><p>Nomor tiket Anda:</p><p><b style="font-size:20px">${id}</b></p><p class="mut">Pantau status dan balasan di Riwayat Saya.</p><a class="btn" href="#riwayat">Lihat riwayat</a></div>`;
  };
}
function pRiwayat(el){
  const mine=reports().filter(r=>r.uid===S.me.id).sort((a,b)=>b.createdAt-a.createdAt);
  el.innerHTML=`<h1>Riwayat Saya</h1><p class="mut">Pantau status aspirasi Anda.</p>`+(mine.length?mine.map(m=>`
  <div class="item"><div class="top"><span class="badge">${esc(m.type)}</span><span class="badge s-${m.status}">${m.status}</span><span class="mut">${esc(m.id)} · ${fmt(m.createdAt)}</span></div>
  <h3>${esc(m.title)}</h3><p class="mut" style="margin:0">${esc(m.agency)}</p><p style="margin:6px 0 0;white-space:pre-wrap">${esc(m.body)}</p>
  ${m.reply?`<div class="reply"><b>Balasan petugas:</b><br>${esc(m.reply)}</div>`:''}</div>`).join(''):`<div class="card"><p class="mut">Belum ada aspirasi. <a href="#buat">Kirim yang pertama</a>.</p></div>`);
}
function csv(rs){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const h=['Tiket','Tanggal','Jenis','Instansi','Judul','Uraian','Lokasi','Pengirim','Kontak','Status','Balasan'];
  return '\ufeff'+[h.map(q).join(',')].concat(rs.map(r=>[r.id,fmt(r.createdAt),r.type,r.agency,r.title,r.body,r.location,r.name,r.contact,r.status,r.reply].map(q).join(','))).join('\n');
}
function pAdmin(el){
  const all=reports().sort((a,b)=>b.createdAt-a.createdAt);
  const cnt=t=>all.filter(r=>t==='Semua'||r.type===t).length;
  const sel=S.sel&&all.find(r=>r.id===S.sel);
  if(sel){
    el.innerHTML=`<button class="btn sec sm" id="back">← Kembali</button><div class="card" style="margin-top:12px">
    <div class="top"><span class="badge">${esc(sel.type)}</span><span class="mut">${esc(sel.id)} · ${fmt(sel.createdAt)}</span></div>
    <h2>${esc(sel.title)}</h2><p class="mut">Tujuan: ${esc(sel.agency)}${sel.location?' · Lokasi: '+esc(sel.location):''}</p>
    <p style="white-space:pre-wrap">${esc(sel.body)}</p>
    <p class="mut">Pengirim: <b>${esc(sel.name)}</b>${sel.contact?' · '+esc(sel.contact):''}</p>
    <hr style="border:0;border-top:1px solid var(--bd);margin:14px 0"><h3>Tanggapi</h3>
    <label>Status</label><select id="a-st">${STAT.map(s=>`<option ${s===sel.status?'selected':''}>${s}</option>`).join('')}</select>
    <label>Balasan untuk pengirim</label><textarea id="a-re" maxlength="2000">${esc(sel.reply)}</textarea>
    <div id="msg"></div><p></p><div class="row" style="justify-content:flex-start"><button class="btn" id="a-save" style="flex:0 0 auto">Simpan tanggapan</button><button class="btn del" id="a-del" style="flex:0 0 auto">Hapus</button></div></div>`;
    $('#back').onclick=()=>{S.sel=null;render()};
    $('#a-save').onclick=()=>{const rs=reports(),r=rs.find(x=>x.id===sel.id);r.status=$('#a-st').value;r.reply=$('#a-re').value.trim();Store.set('reports',rs);$('#msg').className='okm';$('#msg').textContent='Tersimpan.'};
    $('#a-del').onclick=()=>{if(confirm('Hapus aspirasi ini secara permanen?')){Store.set('reports',reports().filter(x=>x.id!==sel.id));S.sel=null;render()}};
    return;
  }
  const list=all.filter(r=>(S.tab==='Semua'||r.type===S.tab)&&(S.st==='Semua'||r.status===S.st)&&(!S.q||(r.title+r.body+r.id+r.name+r.agency).toLowerCase().includes(S.q.toLowerCase())));
  const keep=document.activeElement&&document.activeElement.id==='a-q';
  el.innerHTML=`<div class="row" style="margin-bottom:6px"><div><h1>Panel Admin</h1><p class="mut">Seluruh pengaduan, laporan, saran, dan kritik dari warga.</p></div><div style="flex:0 0 auto"><button class="btn sec sm" id="a-csv">⬇ Ekspor CSV</button></div></div>
  <div class="grid" style="margin-bottom:14px">${['Semua',...TYPES].map(t=>`<div class="tile"><span class="mut">${t==='Semua'?'Total':t}</span><b>${cnt(t)}</b></div>`).join('')}</div>
  <div class="tabs" id="a-tabs">${['Semua',...TYPES].map(t=>`<button data-t="${t}" class="${S.tab===t?'on':''}">${t}</button>`).join('')}</div>
  <div class="row" style="margin-bottom:12px"><input id="a-q" placeholder="Cari judul, isi, nama, atau tiket…" value="${esc(S.q)}"><select id="a-f">${['Semua',...STAT].map(s=>`<option ${S.st===s?'selected':''}>${s}</option>`).join('')}</select></div>
  <div id="a-list">${list.length?list.map(r=>`<div class="item click" data-id="${r.id}"><div class="top"><span class="badge">${esc(r.type)}</span><span class="badge s-${r.status}">${r.status}</span><span class="mut">${esc(r.id)} · ${fmt(r.createdAt)}</span></div><h3>${esc(r.title)}</h3><p class="mut" style="margin:0">${esc(r.name)} → ${esc(r.agency)}</p></div>`).join(''):'<div class="card"><p class="mut">Tidak ada data yang cocok.</p></div>'}</div>`;
  $('#a-tabs').onclick=e=>{if(e.target.dataset.t){S.tab=e.target.dataset.t;render()}};
  $('#a-f').onchange=e=>{S.st=e.target.value;render()};
  $('#a-q').oninput=e=>{S.q=e.target.value;render()};
  $('#a-csv').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv(list)],{type:'text/csv'}));a.download='aspirasi.csv';a.click()};
  if(keep){const q=$('#a-q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
  $('#a-list').onclick=e=>{const it=e.target.closest('.item');if(it){S.sel=it.dataset.id;render()}};
}
window.addEventListener('hashchange',()=>{if(route()!=='admin')S.sel=null;render()});
seed().then(render);
</script>
</body>
</html>
